name: Manual Past Date Commit

on:
  workflow_dispatch:

jobs:
  make-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2 # Yahan v4.2.2 karne se warning hat jayegi

      - name: Make Past Date Commit
        run: |
          git config --global user.email "gouravberwal003@gmail.com"
          git config --global user.name "GouravBerwal"
          
          # Jis date ko green karna hai, use badlein
          TARGET_DATE="2026-10-18T12:00:00"
          
          export GIT_AUTHOR_DATE="$TARGET_DATE"
          export GIT_COMMITTER_DATE="$TARGET_DATE"
          
          echo "Streak fixed for $TARGET_DATE" >> streak_log.txt
          git add streak_log.txt
          git commit -m "Streak fixed for $TARGET_DATE"
          git push origin main
